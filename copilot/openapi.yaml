openapi: 3.0.0
info:
  title: Inbox Guardian API — free headless (Pages CORS)
  version: 0.2.1
servers:
  - url: https://artdgr.github.io/inbox-guardian
paths:
  /data/highlights.json:
    get:
      operationId: getHighlights
      summary: Get urgent + attention highlights (ALL folders, free GitHub Pages CORS)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated: { type: string }
                  mailbox: { type: string }
                  highlights:
                    type: array
                    items:
                      type: object
  /highlights:
    get:
      operationId: getHighlightsAlt
      summary: Alias for local dev
      responses:
        '200':
          description: OK
  /classify:
    post:
      operationId: classify
      summary: Classify single email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject: { type: string }
                bodyPreview: { type: string }
                from: { type: string }
      responses:
        '200':
          description: OK
